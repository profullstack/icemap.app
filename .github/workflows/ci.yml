name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # Boot the standalone server the way the image does, and render one
      # sharp-backed route: the standalone trace has dropped libvips before.
      - name: Boot standalone under Bun
        working-directory: apps/web
        run: |
          cp -r public .next/standalone/apps/web/public
          cp -r .next/static .next/standalone/apps/web/.next/static
          cd .next/standalone
          PORT=8080 HOSTNAME=127.0.0.1 SUPABASE_URL=http://127.0.0.1:9 SUPABASE_SERVICE_ROLE_KEY=ci \
            bun apps/web/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          set -e
          for p in / /about /recent /login /sw.js /manifest.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")
            echo "$p $code"; [ "$code" = 200 ]
          done
          ct=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' 'http://127.0.0.1:8080/_next/image?url=%2Fbanner.png&w=640&q=75')
          echo "/_next/image $ct"; [ "$ct" = "200 image/png" ]
          cat server.log

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=critical
